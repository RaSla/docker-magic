version: '2.4'
services:

### EXPORTERS
  # https://github.com/google/cadvisor
  # https://grafana.com/grafana/dashboards/8321-docker-monitoring-with-node-selection/
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1  # v0.39.3
    container_name: cadvisor
    ports:
      - "${CADVISOR_PORT:-0.0.0.0:48080}:8080"
    privileged: true
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

# docker network create app
networks:
  default:
    external:
      name: "app"
