#version: '3'
services:
  ocserv:
    image: quay.io/aminvakil/ocserv:1.3.0-16
    container_name: ocserv
    sysctls:
    - net.ipv4.ip_forward=1
    cap_add:
    - NET_ADMIN
    #security_opt:
    #- no-new-privileges
    ports:
    - "0.0.0.0:443:443"
    #- "0.0.0.0:443:443/udp"
    environment:
    - CA_CN=My CA
    - CA_ORG=My Corp
    - CA_DAYS=3650
    - SRV_CN=start-ub-fra.test
    - SRV_ORG=My-Test
    - SRV_DAYS=365
    - NO_TEST_USER=1
    volumes:
    - ./ocserv/:/etc/ocserv/
    restart: unless-stopped
